<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLSI Practice Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header id="header">
      <div class="header-bg"></div>
      <div class="header-content">
        <div class="header-actions">
          <button id="theme-btn" onclick="toggleTheme()" class="action-btn-sm">🌙</button>
          <button id="lang-btn" onclick="toggleLanguage()" class="action-btn-sm">عربي / EN</button>
        </div>
        <div id="google_translate_element" style="display: none;"></div>
        <div class="course-code">ELC 432 · Electronics Circuits Design</div>
        <h1 class="title">VLSI Practice Quiz</h1>
        <p class="subtitle">250 questions · 17 topics</p>
        <div id="score-display"></div>
      </div>
    </header>

    <main class="main-content">
      <div class="filters-section">
        <div class="section-title">Filter by Topic</div>
        <div id="filters-container" class="filters-container"></div>
      </div>

      <div id="progress-section" class="progress-section">
        <div class="progress-labels">
          <span id="answered-count">0 / 250 answered</span>
          <span id="page-count">Page 1 of 5</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
      </div>

      <div id="questions-container" class="questions-container"></div>

      <div id="pagination-container" class="pagination-container"></div>

      <div id="actions-container" class="actions-container"></div>
    </main>
  </div>
<Footer>
    <p>Generated By : Eyad Elq3q3y</p>
</Footer>
  <script src="script.js"></script>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'ar,en', autoDisplay: false}, 'google_translate_element');
    }
    function toggleLanguage() {
      var select = document.querySelector(".goog-te-combo");
      if (select) {
        if (select.value === 'ar') {
          select.value = 'en';
          document.body.setAttribute('dir', 'ltr');
        } else {
          select.value = 'ar';
          document.body.setAttribute('dir', 'rtl');
        }
        select.dispatchEvent(new Event('change'));
      }
    }
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      var btn = document.getElementById('theme-btn');
      if (document.body.classList.contains('light-mode')) {
        btn.textContent = '☀️';
      } else {
        btn.textContent = '🌙';
      }
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
